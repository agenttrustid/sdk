[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttrustid"
version = "0.5.0"
description = "AgentTrust ID SDK — runtime authorization, opaque agent tokens, and Guardian checks for AI agents"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.8"
authors = [
    { name = "AgentTrust", email = "contact@agenttrust.id" },
]
maintainers = [
    { name = "AgentTrust", email = "contact@agenttrust.id" },
]
keywords = ["ai", "agents", "authentication", "authorization", "security", "mcp", "a2a", "opaque-tokens"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Identity keys require cryptography (Ed25519, PKIX/PKCS8) and the native OS
# keychain backend uses keyring. Framework integrations are opt-in via extras.
dependencies = [
    "cryptography>=41.0",
    "keyring>=24.0",
]

[project.urls]
Homepage = "https://agenttrust.id"
Documentation = "https://agenttrust.id/docs"
Source = "https://github.com/agenttrustid/sdk"
Repository = "https://github.com/agenttrustid/sdk"
Issues = "https://github.com/agenttrustid/sdk/issues"
Changelog = "https://github.com/agenttrustid/sdk/releases"

[project.optional-dependencies]
langchain = [
    "langchain-core>=0.1.0",
]
agent = [
    "duckduckgo-search>=7.0",
    "schedule>=1.2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "pytest-cov",
    "black",
    "mypy",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=agenttrustid --cov-report=term-missing --cov-fail-under=93"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
include = ["agenttrustid*"]

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
