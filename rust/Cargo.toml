[package]
name = "agenttrustid"
version = "0.4.0"
edition = "2021"
description = "AgentTrust ID SDK — runtime authorization, opaque agent tokens, and Guardian checks for AI agents"
license = "Apache-2.0"
repository = "https://github.com/agenttrustid/sdk"
homepage = "https://agenttrust.id"
documentation = "https://docs.rs/agenttrustid"
readme = "README.md"
keywords = ["ai", "agents", "security", "authorization", "mcp"]
categories = ["authentication", "api-bindings"]
authors = ["AgentTrust <contact@agenttrust.id>"]
rust-version = "1.74"

[dependencies]
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
# Client-side Ed25519 identity keys (PKIX/SPKI + PKCS#8 PEM).
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# SHA-256 for the DPoP access-token hash (ath claim, RFC 9449).
sha2 = "0.10"
# OS keychain storage for KeyStore (opt-in via the `keychain` feature).
keyring = { version = "3", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
mockito = "1"

[features]
default = ["blocking"]
blocking = ["reqwest/blocking"]
async = ["tokio", "reqwest/default-tls"]
# Enable SystemKeychain (macOS Keychain / Windows Cred Manager / Linux Secret Service).
keychain = ["dep:keyring"]
